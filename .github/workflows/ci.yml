name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────
  # Lint + typecheck + build
  # ─────────────────────────────────────────────
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: juris_flow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/juris_flow_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/juris_flow_test
      AUTH_SECRET: ${{ secrets.AUTH_SECRET_TEST || 'test-secret-aaaaaaaaaaaaaaaa-min-32' }}
      AUTH_URL: http://localhost:3000
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST || 'sk-ant-test-placeholder-for-ci-only' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=packages/db

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: false

      - name: Format check
        run: npx prettier --check "**/*.{ts,tsx,md,json,css}"

      - name: Build web
        run: npm run build --workspace=apps/web
        env:
          SKIP_ENV_VALIDATION: '1'

  # ─────────────────────────────────────────────
  # Testes (Sprint 1+ adicionará Vitest)
  # ─────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm test --workspaces --if-present

  # ─────────────────────────────────────────────
  # Verificações de segurança
  # ─────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: false
